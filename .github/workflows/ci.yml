name: Validate API and mobile
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: expenses_test
          MYSQL_USER: expenses
          MYSQL_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://expenses:ci-only-password@127.0.0.1:3306/expenses_test
      JWT_SECRET: ci-only-secret-not-used-outside-isolated-tests
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py
      - run: pip install -r requirements.lock
      - run: alembic upgrade head
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: mysql+pymysql://expenses:ci-only-password@127.0.0.1:3306/expenses_test
  mobile:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npx expo install --check
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: mobile/test-results/
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm audit --prefix mobile --audit-level=low
